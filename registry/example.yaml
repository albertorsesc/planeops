# Example registry. Replace with your own machine's entries.
#
# It demonstrates every DRIFT section without assuming any particular private
# tool: entries on the `manual`, `launchd`, `pkg-brew`, and `ollama` adapters are
# covered today; entries whose real adapter is not yet built (claude-code)
# surface under Uncovered, never as violations.
#
# LLM access here is bridged through public tools, never a provider API direct:
# a coding harness (Claude Code), a router (OpenRouter), and local models
# (Ollama). Swap in whatever you actually run.

entries:
  - id: manual/machine-inventory
    adapter: manual
    domain: host
    lifecycle: active
    intent: "attested host inventory until adapters cover it"

  - id: claude-code/harness
    adapter: claude-code
    domain: harness
    lifecycle: active
    auth: interactive
    intent: "primary coding harness; config adapter lands M3"

  - id: manual/openrouter-api-key
    adapter: manual
    domain: secret
    lifecycle: active
    auth: interactive
    intent: "bridged LLM router (OpenRouter); presence-only until secrets land M4"

  - id: ollama/llama3.2:3b
    adapter: ollama
    domain: model
    lifecycle: active
    intent: "local model, pulled and observed via the ollama adapter"

  - id: ollama/some-large-model:70b
    adapter: ollama
    domain: model
    lifecycle: parked
    intent: "kept on disk but no current consumer"
    kill_criteria: "no consumer for 30 days"

  - id: pkg-brew/ripgrep
    adapter: pkg-brew
    domain: package
    lifecycle: active
    intent: "fast search, installed via Homebrew"

  - id: launchd/com.example.agent-gateway
    adapter: launchd
    domain: service
    lifecycle: active
    intent: "an always-on local service, converged by the launchd adapter"

  - id: launchd/com.example.retired-gateway
    adapter: launchd
    domain: service
    lifecycle: retired
    intent: "retired; absence is desired state, recorded so a reboot cannot resurrect it"
