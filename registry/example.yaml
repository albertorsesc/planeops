# Example registry. Replace with your own machine's entries.
#
# It demonstrates every DRIFT section without assuming any particular private
# tool: entries on the `manual`, `launchd`, `pkg-brew`, `pkg-uv`, `pkg-npm`,
# `pkg-nvm`, `ollama`, `mcp`, `chezmoi`, and `secrets` adapters are covered today;
# entries whose real adapter is not yet built (docker) surface under Uncovered,
# never as violations. Per-machine adapter settings (mcp sources, import rules,
# the secrets store path) live in `instance.yaml`; `chezmoi` reproduces config
# files; `secrets` tracks secret presence from a sops store (never values).
#
# LLM access here is bridged through public tools, never a provider API direct:
# a coding harness (Claude Code), a router (OpenRouter), and local models
# (Ollama). Swap in whatever you actually run.

entries:
  - id: manual/machine-inventory
    adapter: manual
    domain: host
    lifecycle: active
    intent: "attested host inventory until adapters cover it"

  - id: docker/local-registry
    adapter: docker
    domain: service
    lifecycle: active
    intent: "a container service; the docker adapter is deferred, so this is Uncovered"

  - id: chezmoi/.zshrc
    adapter: chezmoi
    domain: config
    lifecycle: active
    intent: "shell config, reproduced from a chezmoi source"

  - id: secrets/openrouter-api-key
    adapter: secrets
    domain: secret
    lifecycle: active
    auth: interactive
    intent: "bridged LLM router key; presence tracked from the sops store"

  - id: ollama/llama3.2:3b
    adapter: ollama
    domain: model
    lifecycle: active
    intent: "local model, pulled and observed via the ollama adapter"

  - id: ollama/some-large-model:70b
    adapter: ollama
    domain: model
    lifecycle: parked
    intent: "kept on disk but no current consumer"
    kill_criteria: "no consumer for 30 days"

  - id: pkg-brew/ripgrep
    adapter: pkg-brew
    domain: package
    lifecycle: active
    intent: "fast search, installed via Homebrew"

  - id: pkg-uv/httpie
    adapter: pkg-uv
    domain: package
    lifecycle: active
    intent: "HTTP client installed as a uv tool"

  - id: pkg-npm/typescript
    adapter: pkg-npm
    domain: package
    lifecycle: active
    intent: "global TypeScript compiler"

  - id: pkg-nvm/22.11.0
    adapter: pkg-nvm
    domain: runtime
    lifecycle: active
    intent: "pinned node runtime (observe-only; nvm is a shell function)"

  - id: launchd/com.example.agent-gateway
    adapter: launchd
    domain: service
    lifecycle: active
    intent: "an always-on local service, converged by the launchd adapter"

  - id: launchd/com.example.retired-gateway
    adapter: launchd
    domain: service
    lifecycle: retired
    intent: "retired; absence is desired state, recorded so a reboot cannot resurrect it"
