# Observed items matching these globs are skipped before diffing, so machine-
# generated workloads never appear as drift (SPEC.md section 2). A glob says
# "do not ask me about this", not "do not look": the item is still observed and
# recorded, and a glob never covers something you have declared.
#
# A pattern claims a name space, and anything can enter a name space by naming
# itself, so a pattern does not cover a service that runs code at login. Name
# that one exactly (`launchd/com.vendor.updater`) and it stays quiet, because
# then you have looked at the thing you are exempting.

globs:
  - glob: "*/session-*"
    reason: "ephemeral agent session stores"
  - glob: "*/*.testbed"
    reason: "generated stress-test workspaces"

# A publisher matches the identity an adapter attested rather than a name the
# subject picked, so one line covers everything that publisher ships, including
# what it ships next. On macOS the `launchd` adapter reports the Team ID its
# program is signed with, which is why a vendor's updaters can be exempted at
# once while an agent running `/bin/sh -c ...` cannot: the OS signs its own
# binaries without a Team ID, so no interpreter ever carries one.
# publishers:
#   - publisher: "ABCDE12345"
#     reason: "the vendor's own updaters; they install and remove these"
