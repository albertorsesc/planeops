name: CI

on:
  push:
    branches: [main]
  # `edited` is included because the changelog guard reads the PR TITLE: without
  # it, a PR can be opened as `chore:`, pass, then be retitled `feat:` and merge
  # on a check that never saw the new title. The heavy jobs skip that event.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# The workflow only reads the repo; never grant the default write token.
permissions:
  contents: read

jobs:
  # SemVer accounting is mechanical, not remembered: a feature or fix PR must
  # carry its CHANGELOG entry, because the Unreleased section is what decides
  # the next release's bump. The title comes in through the environment so a
  # crafted PR title cannot inject into the shell.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Feature and fix PRs update the changelog
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$TITLE" in
            feat*|fix*) ;;
            *) echo "not a feat/fix PR; no changelog entry required"; exit 0 ;;
          esac
          # The UNRELEASED section must gain content. Touching the file proves
          # nothing (a typo fix in an old release satisfied both a path check
          # and a naive added-line count), and the Unreleased section is the
          # only part that decides the next version's bump.
          unreleased() {
            git show "$1:CHANGELOG.md" 2>/dev/null | awk '
              /^## \[Unreleased\]/ { f = 1; next }
              /^## \[/ { f = 0 }
              f
            ' | grep -c '[^[:space:]]' || true
          }
          before="$(unreleased "$BASE")"
          after="$(unreleased HEAD)"
          if [ "$after" -gt "$before" ]; then
            echo "the Unreleased section grew from $before to $after line(s)"
          else
            echo "::error::a feat/fix PR must add its entry to CHANGELOG.md's Unreleased section (it decides the next version bump)"
            exit 1
          fi
          # A break is declared twice or not at all: the `!` in the subject and
          # the marker in the notes have to agree, or the version guard reads a
          # break as an ordinary change and lets it ship in the patch slot.
          case "$TITLE" in
            feat!*|fix!*|feat\(*\)!*|fix\(*\)!*)
              if git diff -U0 "$BASE"...HEAD -- CHANGELOG.md |
                 grep -qE '^\+\s*[-*]\s*\*\*BREAKING'; then
                echo "breaking change declared in both the subject and the notes"
              else
                echo "::error::a breaking PR (feat!/fix!) must add a **BREAKING:** entry to CHANGELOG.md, since the release guard reads the notes, not the subject"
                exit 1
              fi ;;
          esac

      # The other half: a release PR's NUMBER must agree with its notes, so a
      # break can never ship as a patch and the reserved slot cannot move
      # without one. Runs on every PR, since the version and the changelog are
      # in the tree whatever the title says.
      - name: The version bump agrees with its changelog section
        run: python3 scripts/check_version_bump.py

  gate:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload; no stored token
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check planeops tests

      - name: Format check
        run: uv run --frozen ruff format --check planeops tests

      - name: Type check
        run: uv run --frozen mypy

      - name: Tests
        run: uv run --frozen pytest -q --cov=planeops --cov-report=xml

      # One upload per run: both matrix legs measure the same tree. Skipped for
      # a PR from a fork, which by design receives no OIDC token however the
      # permission is declared; without this the required gate would fail for
      # every outside contributor, and coverage is not worth that.
      - name: Upload coverage
        if: >-
          matrix.python-version == '3.12' &&
          github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false

  # Linux parity: run the real-tool integration tests against actual
  # sops/age/chezmoi and (via a systemd --user session) systemctl.
  integration:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    env:
      SOPS_VERSION: "3.13.3"
      SOPS_SHA256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
      CHEZMOI_VERSION: "2.71.1"
      CHEZMOI_SHA256: "e1fb16c962644d57f4d451c324aa86163d00faf5d035500f41fb48943a66dfed"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      # Every third-party binary is version-pinned and checksum-verified; no
      # curl-pipe-sh and no unverified release download reaches the runner.
      - name: Install sops, age, chezmoi (pinned + verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age
          # Spread over ~30s rather than the ~12s five back-to-back attempts
          # take: the releases CDN drops connections in short bursts, and the
          # attempts have to outlast the burst to be worth making. Stated here
          # rather than inherited from whatever curl config the runner image
          # happens to ship.
          fetch() {
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 180 "$1" -o "$2"
          }
          fetch "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            "$HOME/.local/bin/sops"
          echo "${SOPS_SHA256}  $HOME/.local/bin/sops" | sha256sum -c -
          chmod +x "$HOME/.local/bin/sops"
          fetch "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz" \
            /tmp/chezmoi.tar.gz
          echo "${CHEZMOI_SHA256}  /tmp/chezmoi.tar.gz" | sha256sum -c -
          tar -xzf /tmp/chezmoi.tar.gz -C /tmp chezmoi
          install -m 0755 /tmp/chezmoi "$HOME/.local/bin/chezmoi"

      # Fails loudly: a missing user bus must not silently skip the systemd
      # integration test.
      - name: Start a systemd --user session
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 15); do
            XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user list-units --no-legend >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "systemd --user session never came up" >&2
          exit 1

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Integration tests (real sops/age/chezmoi + systemctl --user)
        run: uv run --frozen pytest tests/integration -v

  # macOS parity: the launchd integration test runs against the real launchctl,
  # plus the sops/age/chezmoi integrations with the real tools from brew.
  integration-macos:
    if: github.event.action != 'edited'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install sops, age, chezmoi
        run: brew install sops age chezmoi

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Integration tests (real launchctl + sops/age/chezmoi)
        run: uv run --frozen pytest tests/integration -v
