name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check engine tests

      - name: Format check
        run: uv run --frozen ruff format --check engine tests

      - name: Type check
        run: uv run --frozen mypy

      - name: Tests
        run: uv run --frozen pytest -q

  # Linux parity: run the real-tool integration tests against actual
  # sops/age/chezmoi and (via a systemd --user session) systemctl.
  integration:
    runs-on: ubuntu-latest
    env:
      SOPS_VERSION: "3.13.3"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install sops, age, chezmoi
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age
          curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            -o "$HOME/.local/bin/sops"
          chmod +x "$HOME/.local/bin/sops"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Start a systemd --user session (for the systemd integration test)
        run: |
          set -uo pipefail
          sudo loginctl enable-linger "$USER" || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 15); do
            XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user list-units --no-legend >/dev/null 2>&1 && break
            sleep 1
          done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running || true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Integration tests (real sops/age/chezmoi + systemctl --user)
        run: uv run --frozen pytest tests/integration -v
