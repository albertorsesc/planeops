# Per-machine adapter settings for this instance.
#
# Three kinds of config live in a planeops instance, kept apart on purpose:
#   registry/*.yaml        what should exist (desired state; one file or many)
#   secrets.sops.yaml      encrypted secret values (a sops store, instance root)
#   instance.yaml (this)   how this machine's adapters read: where they look
#
# `plane init` writes this file as `instance.yaml` (gitignored); edit the
# sections for the adapters you actually run. The engine names no tool; every
# tool-specific path appears only here. Each section is optional: omit one and
# that adapter falls back to its default (no sources / no rules / the default
# secrets store).

# --- mcp adapter: where MCP servers are wired on this machine ----------------
# Each source: label (shown as the source), path (`~` expands to home), format
# (`json` or `yaml`), key (the mapping holding the servers; default mcpServers),
# and optionally logs: a template for that client's per-server log file, with
# {name} standing for the server name, so seeded entries know where to look.
# `manage: true` (off by default) lets `plane apply` UNWIRE a retired server
# from a client's user-scope config: previewed, confirmed, digest-guarded,
# with the removed block backed up outside this instance first.
# mcp:
#   sources:
#     - label: coding-harness
#       path: ~/.some-harness/config.json
#       format: json
#       key: mcpServers

#     - label: desktop-app
#       path: ~/Library/Application Support/SomeApp/config.json
#       format: json
#       key: mcpServers

#     - label: gateway
#       path: ~/.some-gateway/config.yaml
#       format: yaml
#       key: mcp_servers

# --- footprint adapter: discover tools by the config traces they leave ------
# Each root: label (the convention's name), path (`~/...` expands to home;
# home itself must be quoted "~" because YAML reads a bare ~ as null), and
# optionally `dot_only: true` (scan only dot-children, what makes "~" mean
# home dotfiles) and `os: darwin|linux` (scan only on that system). The same
# tool across roots merges into one observation (`.ollama` + an app-support
# `Ollama` is one tool, two footprints), and a configured root is never
# itself a tool. A tool whose name matches another adapter's declared entry
# (the `gh` trace when `pkg-brew/gh` is in the registry) is attributed to
# that entry instead of asking for its own. Stat-only: nothing is opened, so
# credential-bearing configs contribute their name and shape, never their
# contents. Debris is skipped by default (OS artifacts like .DS_Store,
# shell/editor state, *_history, *.bak/*.backup/*.old, the cache dir);
# `ignore:` adds name patterns (fnmatch against the on-disk name,
# case-sensitive on every OS) and `ignore_defaults: false` disables the
# built-in list. Omit the section to scan nothing.
# footprint:
#   ignore: [".myjunk-*"]
#   roots:
#     - {label: xdg-config, path: ~/.config}
#     - {label: xdg-data, path: ~/.local/share}
#     - {label: xdg-state, path: ~/.local/state}
#     - {label: home-dot, path: "~", dot_only: true}
#     - {label: app-support, path: ~/Library/Application Support, os: darwin}

# --- import: manifest section -> adapter mapping for `plane import stackfile` -
# The first rule whose `keyword` appears (case-insensitively) in a section header
# wins. A section that matches no rule imports as `manual`, for you to sort out.
importer:
  rules:
    - keyword: machine
      adapter: manual
      domain: host

    - keyword: service
      adapter: launchd
      domain: service

    - keyword: package
      adapter: pkg-brew
      domain: package

    - keyword: model
      adapter: ollama
      domain: model

    - keyword: mcp
      adapter: mcp
      domain: mcp-server

    - keyword: secret
      adapter: secrets
      domain: secret

    # Tool-specific example: map a "skills" section to your coding harness's
    # adapter once it exists. Uncomment and adapt.
    # - keyword: skill
    #   adapter: my-harness
    #   domain: skill

# --- secrets: which store, its knobs, and where values may be materialized ----
# `store` names the store KIND (discovered, like adapters; omit it to use the
# shipped default, sops). A store's own settings nest under its name: for sops, `path`
# (relative to the instance root) is the presence-tracked store file, defaulting
# to secrets.sops.yaml at the instance root (deliberately NOT inside
# registry/, which holds only entries and globs). `allow_targets` bounds where `plane apply` may
# write a materialized secret value: the instance repo and your home directory
# are always allowed, and each entry here adds another base. A target that
# resolves outside every base (e.g. via a symlinked directory) is refused, so a
# secret can't be redirected out of trusted space.
secrets:
  store: sops
  sops:
    path: secrets.sops.yaml
  # allow_targets:
  #   - ~/.config/some-tool
  #   - /etc/some-service
