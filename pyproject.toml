[project]
name = "control-plane"
version = "0.1.0"
description = "Reproduce, observe, and govern a personal AI setup as three planes."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
plane = "engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
