[project]
name = "planeops"
dynamic = ["version"]  # single-sourced from planeops/__init__.py
description = "Reproduce, observe, and govern a personal AI setup as three planes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = [
    "control-plane",
    "declarative",
    "drift",
    "reconcile",
    "mcp",
    "ai-stack",
    "dotfiles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/albertorsesc/planeops"
Repository = "https://github.com/albertorsesc/planeops"
Changelog = "https://github.com/albertorsesc/planeops/blob/main/CHANGELOG.md"
Issues = "https://github.com/albertorsesc/planeops/issues"

[project.scripts]
plane = "planeops.cli:main"
plane-mcp = "planeops.mcp_server.server:main"  # needs the `mcp` extra

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-PyYAML>=6",
    "mcp>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "planeops/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["planeops"]

# Explicit allowlist so the sdist can never pick up untracked local files.
[tool.hatch.build.targets.sdist]
only-include = [
  "planeops",
  "tests",
  "registry",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SPEC.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "Makefile",
  "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Inline YAML fixtures read best on one line; length is not a concern in tests.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["planeops"]
