[project]
name = "planeops"
version = "0.1.0"
description = "Reproduce, observe, and govern a personal AI setup as three planes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
plane = "engine.cli:main"
plane-mcp = "engine.mcp_server.server:main"  # needs the `mcp` extra

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-PyYAML>=6",
    "mcp>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Inline YAML fixtures read best on one line; length is not a concern in tests.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine"]
